<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeShare - Groups</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
          rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          rel="stylesheet" />
    <link rel="stylesheet" href="css/groups.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="dashboard-shell">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" aria-label="Primary">
            <div class="sidebar-brand">
                <div class="avatar avatar--brand" aria-hidden="true">
                    <img id="user-avatar" alt="User Avatar" src="" />
                </div>
                <div>
                    <h1 id="user-name">Loading...</h1>
                    <span id="user-login">@username</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <ul class="sidebar-nav">
                <li><a class="sidebar-link" href="/" data-route="home"><span
                            class="material-symbols-outlined">home</span><span>Home</span></a></li>
                <li><a class="sidebar-link" href="/messages" data-route="messages"><span
                            class="material-symbols-outlined">chat_bubble</span><span>Direct Messages</span></a></li>
                <li><a class="sidebar-link sidebar-link--active" href="#" data-route="groups"><span
                            class="material-symbols-outlined icon-filled">groups</span><span>People & Groups</span></a>
                </li>
            </ul>

            <!-- CTA Button -->
            <div class="sidebar-footer">
                <button class="primary-button" type="button" id="newRepoSidebarBtn">New Repository</button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="dashboard-main">
            <!-- Top App Bar -->
            <header class="topbar">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open sidebar">
                    <span class="material-symbols-outlined">menu</span>
                </button>

                <nav class="topbar-tabs" aria-label="Groups">
                    <a class="topbar-tab topbar-tab--active" href="#">Groups</a>
                </nav>

                <!-- Actions -->
                <div class="topbar-actions">
                    <button class="icon-button" type="button" aria-label="Notifications"><span
                            class="material-symbols-outlined">notifications</span></button>
                    <div class="dropdown">
                        <button class="icon-button" type="button" aria-label="Settings" id="settingsButton">
                            <span class="material-symbols-outlined">settings</span>
                        </button>
                        <div class="dropdown-backdrop" id="settingsBackdrop"></div>
                        <div class="dropdown-menu" id="settingsDropdown">
                            <button class="dropdown-item danger" id="logoutButton">
                                <span class="material-symbols-outlined">logout</span>
                                <span>Logout</span>
                            </button>
                        </div>
                    </div>
                    <button class="secondary-button" type="button" id="newGroupSidebarBtn">Create Group</button>
                </div>
            </header>

            <!-- Page Content -->
            <main class="content">
                <section class="section-block">
                    <div class="section-heading">
                        <h2>Groups</h2>
                        <a href="#">View all</a>
                    </div>

                    <!-- Groups Grid -->
                    <div class="group-grid" id="groups-grid">
                        <!-- Groups will be displayed here -->
                    </div>
                </section>

                    <section class="section-block">
                        <div class="section-heading">
                            <h2>People</h2>
                            <a href="#">View all</a>
                        </div>

                        <!-- Contacts Grid -->
                        <div class="contacts-grid" id="contacts-grid">
                            <!-- Contacts will be displayed here -->
                        </div>
                    </section>
            </main>
        </div>
    </div>

   <!-- Modal System -->
    <script src="js/modal.js"></script>
    <script src="js/modal-handlers.js"></script>
    <script src="js/groups.js"></script>
    <script>
        (async function loadModals() {
            try {
                const response = await fetch('/modals.html');
                const html = await response.text();

                const container = document.createElement('div');
                container.id = 'modalsContainer';
                container.innerHTML = html;
                document.body.appendChild(container);

                initializeAllModals();
            } catch (err) {
                console.error('Failed to load modals:', err);
            }
        })();
    </script>
</body>

</html>
